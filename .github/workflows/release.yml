name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version and tag
        id: get_version
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          if [[ -z "$RAW_TAG" || "$RAW_TAG" == "$GITHUB_REF" ]]; then
            RAW_TAG="v0.0.2"
          fi
          echo "RAW_TAG=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and Package Plugin
        run: |
          chmod +x scripts/package-plugin.sh
          ./scripts/package-plugin.sh --version "${{ steps.get_version.outputs.RAW_TAG }}"

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ContentHider_*.zip
            dist/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy manifest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false

      - name: Commit updated manifest to main branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || git checkout -b main origin/main
          cp dist/manifest.json manifest.json
          if ! git diff --quiet manifest.json; then
            git add manifest.json
            git commit -m "chore: update manifest.json for ${{ steps.get_version.outputs.RAW_TAG }} [skip ci]"
            git push origin main
          fi
