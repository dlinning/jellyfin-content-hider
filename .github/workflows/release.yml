name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: get_version
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${RAW_TAG#v}"
          # If not triggered by a tag (workflow_dispatch), fallback to 0.1.0.0
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF" ]]; then
            VERSION="0.1.0.0"
          fi
          # Ensure 4-part version for Jellyfin (e.g., 0.1.0 -> 0.1.0.0)
          DOT_COUNT=$(echo "$VERSION" | awk -F. '{print NF-1}')
          while [ "$DOT_COUNT" -lt 3 ]; do
            VERSION="${VERSION}.0"
            DOT_COUNT=$((DOT_COUNT + 1))
          done
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and Package Plugin
        run: |
          chmod +x scripts/package-plugin.sh
          ./scripts/package-plugin.sh

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ContentHider_*.zip
            dist/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
